# =========================================================
# Profile: LOCAL (development lokal menggunakan H2 in-memory)
# =========================================================

# -------------------------
# H2 In-Memory Database
# -------------------------
spring.datasource.url=jdbc:h2:mem:logitrackdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: buat tabel saat startup, hapus saat shutdown
spring.jpa.hibernate.ddl-auto=create-drop
# Pastikan data.sql/DataInitializer berjalan setelah DDL selesai dibuat
spring.jpa.defer-datasource-initialization=true

# -------------------------
# H2 Console (bisa diakses di http://localhost:8080/h2-console)
# -------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------
# JPA Logging (tampilkan query SQL untuk debugging)
# -------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# Logging Level (verbose untuk development)
# -------------------------
logging.level.com.example.template=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
