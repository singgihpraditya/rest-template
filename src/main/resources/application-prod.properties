# =========================================================
# Profile: PROD (production dengan PostgreSQL)
# Gunakan environment variable untuk semua credential sensitif
# =========================================================

# -------------------------
# PostgreSQL Database
# -------------------------
# Gunakan env var: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rest_template_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: validasi schema tanpa ubah apapun (aman untuk production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

# -------------------------
# JWT (override dengan env var di production)
# -------------------------
app.jwt.secret=${JWT_SECRET:b3d7d8f4a1c5e9b2f6a3c8d1e4b7f0a2d5c8e1b4f7a0d3c6e9b2f5a8d1e4b7f0}
app.jwt.expiration=${JWT_EXPIRATION:600000}

# -------------------------
# JPA (matikan SQL logging di production)
# -------------------------
spring.jpa.show-sql=false

# -------------------------
# Logging Level (INFO di production, jangan DEBUG)
# -------------------------
logging.level.com.example.template=INFO
logging.level.org.springframework=WARN

# -------------------------
# H2 Console: MATIKAN di production
# -------------------------
spring.h2.console.enabled=false
