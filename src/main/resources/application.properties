# =========================================================
# Konfigurasi utama (base config, berlaku untuk semua profile)
# =========================================================

spring.application.name=rest-template
server.port=8080

# Profile default saat development lokal
spring.profiles.active=local

# =========================================================
# JWT Configuration
# =========================================================
# Secret key dalam format Base64 (minimal 256-bit / 32 karakter setelah decode)
app.jwt.secret=b3d7d8f4a1c5e9b2f6a3c8d1e4b7f0a2d5c8e1b4f7a0d3c6e9b2f5a8d1e4b7f0
app.jwt.expiration=600000

# =========================================================
# SpringDoc / Swagger UI
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================================================
# File Upload (Spring MVC)
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=uploads

# =========================================================
# External REST API URLs
# =========================================================
# JSONPlaceholder: free API untuk contoh pemanggilan service eksternal
external.api.jsonplaceholder.url=https://jsonplaceholder.typicode.com

# =========================================================
# Distributed Tracing (Micrometer + OpenTelemetry)
# =========================================================
# Sample semua request (1.0 = 100%) agar traceId selalu terisi di log
management.tracing.sampling.probability=1.0

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
